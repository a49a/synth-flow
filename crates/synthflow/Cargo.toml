[package]
name = "synthflow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
httpdate = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_path_to_error = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
jsonschema = { version = "0.29", default-features = false }
minijinja = { version = "2", features = ["json", "fuel", "loader"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
tracing.workspace = true
url = "2"
csv = "1.4.0"
arrow = { version = "60.0.0", default-features = false, features = ["json"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow"] }
arrow-json = "60.0.0"
arrow-schema = "60.0.0"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["test-util"] }
