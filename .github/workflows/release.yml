name: Release bundles
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace --locked
      - run: target/release/synthflow --version
      - name: Create archive and checksum
        run: python3 scripts/package_binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthflow-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
